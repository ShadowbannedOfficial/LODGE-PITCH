                padding: 0;

                letter-spacing: 0.26em;
                text-transform: uppercase;
                color: #b89870;
                line-height: 1.4;

                margin: 0 0 1.5rem;
                color: rgba(240, 231, 216, 0.62);
                font-size: 1.15rem;
                line-height: 1.45;
            }

            .staticrypt-instructions:empty,
            .staticrypt-instructions p:empty {
                display: none;
            }

            .staticrypt-title {
                display: none;
            }

            .staticrypt-password-container {
                position: relative;
                outline: 0;
                background: transparent;
                width: 100%;
                border: 0;
                border-bottom: 1px solid rgba(184, 152, 112, 0.45);
                margin: 0 0 1.35rem;
                box-sizing: border-box;
                transition: border-color 0.25s ease;

                border-bottom-color: #b89870;
            }

            .staticrypt-form input[type="text"] {
                background: transparent;
                border: 0;
                box-sizing: border-box;
                color: #f0e7d8;
                font-family: "Cormorant Garamond", Georgia, serif;
                font-size: 1.15rem;
                font-weight: 500;
                letter-spacing: 0.08em;
                outline: 0;
                padding: 0.85rem 2.4rem 0.85rem 0;
                width: 100%;

                padding: 0;
                position: absolute;
                right: 0;
                top: 50%;

                font-weight: 500;
                font-size: 0.72rem;
                letter-spacing: 0.22em;

                background: transparent;
                width: 100%;
                border: 1px solid #b89870;
                padding: 0.95rem 1.25rem;

                cursor: pointer;

                background: #b89870;

                margin-bottom: 1.2em;
                color: rgba(240, 231, 216, 0.55);
